name: daily-scan
on:
  schedule:
    - cron: "43 9 * * *"   # daily incl. weekends; 09:43 UTC = 4:43 AM EST / 5:43 AM EDT — off-the-hour minute to dodge GitHub's :00 scheduler delays
  workflow_dispatch: {}        # manual "Run workflow" button for testing
permissions:
  contents: write
concurrency:
  group: reqcon-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[scrape]"
      - run: reqcon scan --update-readme --ci
      - name: Commit if changed
        run: |
          git config user.name "pn-le"
          git config user.email "117285024+pn-le@users.noreply.github.com"
          git add data reports README.md
          if ! git diff --cached --quiet; then
            git commit -m "scan: $(date -u +%F) [skip ci]"
            git push
          fi
